dense:
  model_id: AITeamVN/Vietnamese_Embedding_v2
  revision: 18b44161e041bf1d3a333ab5144b5b7b93f914d2
  max_length: 2048
  dimension: 1024
  batch_size: 16
  normalize_embeddings: true
  device: auto
  dtype: auto
  trust_remote_code: false

sparse:
  # Generated by legal-ir-ingest-qdrant after a successful hybrid ingestion.
  query_encoder_manifest: ../../DSC_Legal/artifacts/qdrant/legal_long_hybrid_v1.sparse_query/manifest.json

qdrant:
  url: http://127.0.0.1:6333
  api_key_env: QDRANT_API_KEY
  collection: legal_long_hybrid_v1
  dense_vector_name: dense
  sparse_vector_name: sparse
  prefer_grpc: true
  grpc_port: 6334
  timeout_seconds: 120
  exact: true
  hnsw_ef: 128

retrieval:
  dense_top_k: 80
  sparse_top_k: 40

fusion:
  algorithm: weighted_rrf
  rrf_k: 60
  dense_weight: 1.0
  sparse_weight: 1.0
  # These reproduce the long-only research runtime. null means no cap.
  candidate_documents: 120
  evidence_chunks_per_document: 120

reranker:
  model_id: w4ngg/VN_reranker_legal
  revision: 0e57d890e388285166aa2360cdb438eff737d479
  max_length: 2304
  batch_size: 4
  output_top_k: 20
  device: auto
  dtype: auto
  trust_remote_code: false

llm:
  provider: openai_compatible
  model: gemini-3.5-flash-lite
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key_env: LEGAL_RAG_LLM_API_KEY
  timeout_seconds: 40
  max_retries: 2
  temperature: 0.0
  max_output_tokens: 1024
  structured_output_mode: json_schema

rag:
  max_context_tokens: 10000
  max_chunks: 8
  max_chunks_per_document: 8
  include_legal_metadata: true
  merge_adjacent_chunks: false

  evidence:
    min_sources: 1
    min_top_reranker_score: null
    min_top_score_margin: null
